==============================================================================
 README · BluePrint CloudWalker Trainer V10
==============================================================================
 One static HTML file: cloud certification prep, lessons, labs, ADRs, interview
 practice and career outputs. No server code, no account.
 THIS FILE IS BUILT. Edit the source folder (src/) and run `node build.js`;
 changes made here are lost on the next build. See README.md in the source.
 Practice material written for this app; not affiliated with any exam vendor.

 ARCHITECTURE
 · Everything lives in one IIFE in the last <script>. State is the object S:
     S.bank / S.order  questions (Map by id, display order)
     S.progress        answers, flags, confidence ratings, sessions
     S.ws              the workspace: everything the person creates (schema v4)
     S.ui, S.p1..S.p8  screen state that is never saved
 · Routing is the URL hash (#/lessons/les-saa-1). VIEWS[name](arg) returns an
   HTML string; render() paints it; clicks are delegated by data-action.
 · V09.1: pack exams keep their tier and domain weights; draft pack questions
   join practice only when S.ws.includeDrafts is true (Content updates page).
 · Source layout (V10): src/shell (page markup), src/css, src/js/core,
   src/js/features, src/js/boot.js and src/content (bank, glossary). The JS
   files are ordered pieces of one scope, listed in src/manifest.json.
 · Features up to V09.1 wrap earlier functions. New features call
   registerFeature({ id, views, nav, actions, css, onBoot, mergeImport })
   from their own file in src/js/features (see js/core/205-feature-api.js).
 · Boot paints first, then parses the embedded bank in idle-time chunks
   (script.bank-chunk, 100 rows each) with a progress bar, then restores the
   saved workspace from IndexedDB and renders.
 · Saving: IndexedDB database "cloudwalker", store "kv". Key "state" holds the
   current record; "backup:YYYY-MM-DD" keeps 7 daily copies; "ai:config" holds
   the optional AI key (device only, never exported).
 · Sync: one SyncAdapter (LocalOnlyAdapter active, RemoteAdapter stubbed).
   Views never call it. See window.CloudWalker.sync.

 DATA MODEL v4 (file format "cloudwalker-workspace", version 4)
 · { format, version: 4, progress, workspace, drafts, userBank, exported_at }
 · workspace holds adrs, portfolio, labs, labDrafts, interview{stories,
   answers, boards, exec}, career{profile, roles, milestones, apps, weeks},
   srs, recallLog, glossary, outputs, reflections, plan, contentEdits, reports,
   lessons, lessonReview, aiFeedback, calibLog, outcomes, readinessLog, habit,
   packs, packContent, syncState, syncConflicts.
 · Ids are permanent (ADR-007, STAR-003, LAB-012, OUT-001, question ids) and
   are never renumbered. Imports merge by id; the newer copy wins.
 · migrateWorkspace() upgrades V08 files (version 1 to 3) to 4 and refuses
   files from a newer version.
 · Question fields: id, exam_code, domain, subdomain, question, options,
   correct_index (or answerKey for multi/ordering/pbq-sim), correct_rationale,
   optionRationales, docLinks, difficulty, qtype, origin (reserve |
   generated-practice | user-imported), reviewStatus (approved | needs-review |
   draft | retired), lastReviewed, examGuideVersion. Missing data stays empty.

 ADD OR UPDATE AN EXAM PROFILE
 · Edit EXAM_PROFILES (search "const EXAM_PROFILES"), or ship it in a content
   pack under content.examProfiles. Every entry needs name, sourceUrl (the
   official exam page), lastVerified (YYYY-MM-DD) and verified (true/false).
 · Copy numbers only from the official page. If a value is not stated, or you
   are not sure, set it to null and verified to false; the app then shows
   "Check the official exam page". Packs that guess are rejected.

 ADD A CONTENT PACK
 · Data > Content updates > Pack template (.json) or Questions template (.csv).
 · Write items in your own words. New items use origin "generated-practice"
   and reviewStatus "draft" until a person reviews them (approved items need
   lastReviewed). Keep ids stable; retire with content.retired.
 · "Validate a file" gives a report; "Build pack" adds packVersion and the
   SHA-256 checksum. Load it with "Load a pack file" or host it and use
   "Check for content update". Nothing merges until you choose Merge.

 RUN LOCALLY
 · Open the file in a browser: everything works offline from file://, except
   installing as an app.
 · To install it or work offline as an app, serve this file plus
   cloudwalker-sw.js from one folder:  python3 -m http.server 8080
   then open http://localhost:8080/  (any static https host works the same).
==============================================================================
